  <g fill="#1b2a9b" stroke="none" font-size="21" text-anchor="middle">
    <text x="100" y="92" font-size="25">vm x</text><text x="100" y="124" font-size="19">guest os</text><text x="100" y="148" font-size="19">+ apps</text>
    <text x="265" y="92" font-size="25">vm y</text><text x="265" y="124" font-size="19">guest os</text><text x="265" y="148" font-size="19">+ apps</text>
