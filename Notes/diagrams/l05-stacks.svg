<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 525" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',sans-serif" fill="none" stroke="#1b2a9b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <g fill="#1b2a9b" stroke="none" font-size="27" text-anchor="middle">
    <text x="180" y="30">VMs on one physical server</text>
    <text x="575" y="30">Type 1 hypervisor</text>
    <text x="975" y="30">Type 2 hypervisor</text>
    <text x="1345" y="30">Containers</text>
  </g>
  <g transform="translate(0,45)">
    <!-- panel 1: two VMs sharing one server -->
    <rect x="10" y="20" width="340" height="335"/>
    <path d="M95 165 L130 262"/><path d="M265 165 L230 262"/>
    <rect x="60" y="262" width="240" height="38"/>
    <rect x="60" y="300" width="240" height="42" fill="#dfe4ff"/>
    <path d="M40 380 L40 358"/>
    <!-- panel 2: type 1 -->
    <rect x="450" y="95" width="120" height="62"/><rect x="585" y="95" width="120" height="62"/>
    <path d="M510 157 L510 212"/><path d="M645 157 L645 212"/>
    <rect x="440" y="212" width="270" height="60"/>
    <path d="M575 272 L575 300"/>
    <rect x="420" y="300" width="310" height="60" fill="#dfe4ff"/>
    <!-- panel 3: type 2 -->
    <rect x="850" y="95" width="120" height="62"/><rect x="980" y="95" width="120" height="62"/>
    <path d="M910 157 L910 212"/><path d="M1040 157 L1040 212"/>
    <rect x="840" y="212" width="270" height="60"/>
    <path d="M975 272 L975 290"/>
    <rect x="870" y="290" width="210" height="46" fill="#dfe4ff"/>
    <path d="M975 336 L975 356"/>
    <rect x="820" y="356" width="310" height="52" fill="#dfe4ff"/>
    <!-- panel 4: containers (dashed = namespace boundary) -->
    <rect x="1195" y="20" width="140" height="115" stroke-dasharray="9 6"/><rect x="1365" y="20" width="140" height="115" stroke-dasharray="9 6"/>
    <path d="M1196 160 L1210 137"/>
    <path d="M1265 135 L1265 205"/><path d="M1435 135 L1435 205"/>
    <rect x="1160" y="205" width="370" height="64"/>
    <path d="M1295 269 L1295 292"/>
    <rect x="1190" y="292" width="210" height="48" fill="#dfe4ff"/>
    <path d="M1295 340 L1295 362"/>
    <rect x="1160" y="362" width="370" height="48" fill="#dfe4ff"/>

    <g fill="#1b2a9b" stroke="none" font-size="21" text-anchor="middle">
      <text x="100" y="92" font-size="25">VM X</text><text x="100" y="124" font-size="19">guest OS</text><text x="100" y="148" font-size="19">+ apps</text>
      <text x="265" y="92" font-size="25">VM Y</text><text x="265" y="124" font-size="19">guest OS</text><text x="265" y="148" font-size="19">+ apps</text>
      <text x="180" y="288" letter-spacing="1">HYPERVISOR</text>
      <text x="180" y="327" font-size="19">physical CPU, RAM, disk</text>
      <text x="54" y="405" font-size="19" text-anchor="start">network &#8594; Internet</text>
      <text x="54" y="430" font-size="17" text-anchor="start">(VPC rules act here)</text>

      <text x="510" y="127" font-size="24">VM X</text><text x="510" y="148" font-size="15">guest OS + apps</text>
      <text x="645" y="127" font-size="24">VM Y</text><text x="645" y="148" font-size="15">guest OS + apps</text>
      <text x="575" y="249" letter-spacing="1">HYPERVISOR</text>
      <text x="575" y="337" font-size="19" letter-spacing="1">PHYSICAL HARDWARE</text>

      <text x="910" y="127" font-size="24">VM X</text><text x="910" y="148" font-size="15">guest OS + apps</text>
      <text x="1040" y="127" font-size="24">VM Y</text><text x="1040" y="148" font-size="15">guest OS + apps</text>
      <text x="975" y="249" letter-spacing="1">HYPERVISOR</text>
      <text x="975" y="320" letter-spacing="1">HOST OS</text>
      <text x="975" y="388" font-size="19" letter-spacing="1">PHYSICAL HARDWARE</text>

      <text x="1265" y="62" font-size="24">App A</text><text x="1265" y="90" font-size="18">+ libraries</text><text x="1265" y="120" font-size="16" letter-spacing="1">CONTAINER</text>
      <text x="1435" y="62" font-size="24">App B</text><text x="1435" y="90" font-size="18">+ libraries</text><text x="1435" y="120" font-size="16" letter-spacing="1">CONTAINER</text>
      <text x="1160" y="180" font-size="19" text-anchor="start">namespace</text>
      <text x="1345" y="244" font-size="19" letter-spacing="1">CONTAINER ENGINE (DOCKER)</text>
      <text x="1295" y="324" letter-spacing="1">HOST OS</text>
      <text x="1415" y="313" font-size="19" text-anchor="start">&#8212; shared</text><text x="1415" y="337" font-size="19" text-anchor="start">kernel</text>
      <text x="1345" y="393" font-size="19" letter-spacing="1">PHYSICAL HARDWARE</text>
    </g>
  </g>
  <!-- legend -->
  <rect x="10" y="493" width="26" height="18" fill="#dfe4ff"/>
  <text x="46" y="509" fill="#1b2a9b" stroke="none" font-size="19">shaded = shared by everything above it</text>
  <path d="M520 502 L580 502" stroke-dasharray="9 6"/>
  <text x="592" y="509" fill="#1b2a9b" stroke="none" font-size="19">dashed box = namespace: the container's private view of processes, network and files</text>
</svg>
